# =============================================
# PERFIL: CLI (interfaz de consola, version 1)
# Activar con: --spring.profiles.active=cli
# No levanta el servidor web; ejecuta ConsoleRunner y sale al terminar.
# Usa la misma BD (para transacciones); credenciales por variables de entorno.
# =============================================
spring:
  main:
    web-application-type: none
    banner-mode: "off"
  datasource:
    url: ${SPRING_DATASOURCE_URL}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true

# Menu limpio: solo mostramos advertencias/errores del framework.
logging:
  level:
    root: WARN
