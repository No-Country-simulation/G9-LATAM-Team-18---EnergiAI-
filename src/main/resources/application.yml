# =============================================
# Configuracion base (comun a todos los perfiles)
# Los valores sensibles se inyectan por variables de entorno.
# Perfiles: dev (OCI remoto) | prod (localhost en la VM)
# =============================================
spring:
  application:
    name: energiai-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/miapp}
    username: ${SPRING_DATASOURCE_USERNAME:oracleone18}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el dueño del esquema; Hibernate no lo modifica (none).
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  # Ruta del artefacto del modelo (contrato modelo_energiai.json)
  modelo:
    ruta: ${APP_MODELO_RUTA:classpath:model/modelo_energiai.json}
  # JWT: el secreto DEBE tener >= 32 bytes. Cambiar en produccion via env var.
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-por-uno-seguro-de-al-menos-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
