# Perfil de test: H2 en memoria (no depende de PostgreSQL)
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  # En test no usamos Flyway (H2): el esquema lo crea Hibernate (create-drop).
  flyway:
    enabled: false

app:
  jwt:
    secret: secreto-de-test-de-al-menos-32-bytes-1234567890
    expiration-ms: 3600000
